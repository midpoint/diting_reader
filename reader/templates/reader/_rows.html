{% load reader_tags %}{% if not rows %}
  <div class="empty">这个范围内没有文章。</div>
{% endif %}
{% for row in rows %}{% include "reader/_row.html" %}{% endfor %}
{% if rows|length >= window %}
  <div class="list-foot">仅显示最近 {{ window }} 条（窗口上限）{% if multi_source %}；本视图是多源归并口径：<b>每个源</b>先取最近 {{ per_source }} 条再合并排序{% endif %}。</div>
{% endif %}
