{% comment %}
条目分级徽标 —— 只分三档，其余信息藏在 hover 里。

  彩色（级别色）  = 判过的（模型判定 / 人工调整）—— hover 看依据
  红虚线          = 失败兜底 fail-open，级别不可信
  灰虚线          = 没判定（源没配判据 / 还没跑到 / 超窗）

★ 为什么不加「默」「待判」这类文字：列表是读文章的地方。同一个 L2 可能
  是模型判的、也可能是零成本默认来的，两者都写出来会把列表变成分级报表；
  需要确认时 hover 一下就有（依据文字来自 rating_basis）。
{% endcomment %}
<span class="lv {{ row.badge_css }}" title="{{ row.basis }}">L{{ row.level }}</span>
