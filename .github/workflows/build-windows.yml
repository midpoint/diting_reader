name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build portable zip
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_windows_portable.py --version "${{ env.VERSION }}" 2>&1 | tee build.log

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10,<7"

      - name: Build single-file exe
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_windows_exe.py --version "${{ env.VERSION }}" 2>&1 | tee -a build.log

      # 公开仓库的 Actions 日志只能登录后看；失败时把构建日志推到独立分支，
      # 维护者用 git 就能诊断（分支名带 run id，事后可删）。
      - name: Preserve build log on failure
        if: failure()
        shell: bash
        run: |
          if [ ! -s build.log ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build.log ci-build.log
          git add -f ci-build.log
          git commit -m "ci: build log for run ${{ github.run_id }}"
          git push origin HEAD:refs/heads/ci-log-${{ github.run_id }}

      - name: Show artifacts
        shell: bash
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: diting-reader-windows-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 谛听阅读器 v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/diting-reader-windows-${{ env.VERSION }}.zip
            dist/diting-reader-windows-${{ env.VERSION }}.zip.sha256
            dist/diting-reader-windows-${{ env.VERSION }}.exe
            dist/diting-reader-windows-${{ env.VERSION }}.exe.sha256
